name: cards

on:
  schedule:
    - cron: "17 9 * * *"   # daily, 09:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/cards.yml"

permissions:
  contents: write

concurrency:
  group: cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"

      - name: Test (including drift check against mwill20.github.io)
        env:
          ONLINE: "1"
        run: python -m unittest discover -s tests -v

      - name: Render cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_cards.py

      - name: Verify ledger
        run: python scripts/verify_ledger.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards ledger.jsonl README.md
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "cards: nightly render $(date -u +%Y-%m-%d)"
            git push
          fi
